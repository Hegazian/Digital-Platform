name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Shared contracts - build and compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: git diff --exit-code -- dist openapi.json

  server:
    name: API - typecheck & tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: eduplatform_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d eduplatform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5433/eduplatform_test?schema=public
      DIRECT_URL: postgresql://testuser:testpassword@localhost:5433/eduplatform_test?schema=public
      JWT_SECRET: ci_jwt_secret_ci_jwt_secret_ci_jwt_secret_ci
      JWT_REFRESH_SECRET: ci_refresh_secret_ci_refresh_secret_ci_refresh
      RESEND_API_KEY: re_ci_placeholder

    steps:
      - uses: actions/checkout@v4

      - name: Verify lockfile present
        run: ls -la package-lock.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install shared contract dependencies
        working-directory: packages/contracts
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply reviewed migrations to the empty test database
        run: npm run db:migrate:test

      - name: Verify populated pre-M0 upgrade and preservation
        run: npm run db:migrate:fixture

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Tests and whole-source coverage
        run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: server/coverage/

  client:
    name: Web - typecheck, lint & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Verify lockfile present
        run: ls -la package-lock.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install shared contract dependencies
        working-directory: packages/contracts
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Component tests and whole-source coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: client/coverage/

  documentation-and-advisories:
    name: Documentation integrity and dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node docs/scripts/validate-docs.cjs
      - run: node docs/scripts/audit-dependencies.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audits
          path: audit/m1-closure/dependencies/

  browser-m0:
    name: M0 ${{ matrix.mode }} desktop/mobile journeys
    strategy:
      fail-fast: false
      matrix:
        mode: [production, development]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: eduplatform_test
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U testuser -d eduplatform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      M0_WEB_MODE: ${{ matrix.mode == 'development' && 'dev' || 'production' }}
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5433/eduplatform_test?schema=public
      DIRECT_URL: postgresql://testuser:testpassword@localhost:5433/eduplatform_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'
      - run: npm ci
        working-directory: packages/contracts
      - run: npm ci
        working-directory: server
      - run: npx prisma generate
        working-directory: server
      - run: npm run db:migrate:test
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run test:m0:browser
        working-directory: client
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-browser-evidence-${{ matrix.mode }}
          path: |
            client/playwright-report/m0/
            client/test-results/
