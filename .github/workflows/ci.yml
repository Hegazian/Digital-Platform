name: EduPlatform CI/CD

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: eduplatform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install Backend Dependencies
      working-directory: ./server
      run: npm ci

    - name: Apply Prisma Migrations
      working-directory: ./server
      env:
        DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/eduplatform_test?schema=public"
      run: npx prisma db push

    - name: Run Backend Tests (Vitest)
      working-directory: ./server
      env:
        DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/eduplatform_test?schema=public"
        JWT_SECRET: "ci_secret"
      run: npm run test -- --run

  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - name: Install Frontend Dependencies
      working-directory: ./client
      run: npm ci

    - name: Run Next.js Linter
      working-directory: ./client
      run: npm run lint

    - name: Verify Frontend Build
      working-directory: ./client
      run: npm run build

