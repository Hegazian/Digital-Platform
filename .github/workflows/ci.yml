name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: API - typecheck & tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: eduplatform_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d eduplatform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: server

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5433/eduplatform_test?schema=public
      DIRECT_URL: postgresql://testuser:testpassword@localhost:5433/eduplatform_test?schema=public
      JWT_SECRET: ci_jwt_secret_ci_jwt_secret_ci_jwt_secret_ci
      JWT_REFRESH_SECRET: ci_refresh_secret_ci_refresh_secret_ci_refresh
      PAYMOB_HMAC_SECRET: ci_paymob_hmac_ci_paymob_hmac_ci_paymob_hmac
      FAWRY_SECRET_KEY: ci_fawry_key_ci_fawry_key_ci_fawry_key_ci
      CODE_EXECUTION_ENABLED: 'true'
      RESEND_API_KEY: re_ci_placeholder

    steps:
      - uses: actions/checkout@v4

      - name: Verify lockfile present
        run: ls -la package-lock.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Sync database schema
        run: npx prisma db push --skip-generate

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  client:
    name: Web - typecheck, lint & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Verify lockfile present
        run: ls -la package-lock.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Gates are enforced by next.config.mjs (eslint/typescript errors fail)
      - name: Build
        run: npm run build
