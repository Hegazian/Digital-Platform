services:
  test-db:
    image: postgres:15-alpine
    container_name: eduplatform-test-db
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: eduplatform_test
    ports:
      - "5433:5432"
    volumes:
      - test-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d eduplatform_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: eduplatform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  test-db-data:
  redis-data:
